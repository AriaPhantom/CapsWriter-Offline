[package]
name = "capswriter-shell"
version = "1.0.0"
description = "CapsWriter Offline 现代化外壳（Dashboard + Toast 浮层）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
parking_lot = "0.12.5"
sysinfo = "0.39.6"
anyhow = "1.0.104"

[features]
# 由 tauri-build 生成的自定义协议开关
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
