<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapsWriter Overlay</title>
  </head>
  <body>
    <!-- Toast 堆栈 -->
    <div id="stack"></div>

    <!-- 录音指示器 -->
    <div id="rec">
      <span class="rec-dot"></span>
      <span class="rec-label">正在听写</span>
      <span class="rec-bars"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="rec-time" id="rec-time">0.0s</span>
    </div>

    <!-- 通知气泡 -->
    <div id="notes"></div>

    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
