<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CapsWriter Offline</title>
  </head>
  <body>
    <div id="app">
      <!-- ============ 侧栏 ============ -->
      <aside id="side">
        <div class="brand">
          <h1><span class="dot" id="live-dot"></span>CapsWriter</h1>
          <p>OFFLINE</p>
        </div>

        <nav>
          <button class="nav-item on" data-page="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            总览
          </button>
          <button class="nav-item" data-page="client">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            客户端日志
          </button>
          <button class="nav-item" data-page="server">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
            服务端日志
          </button>
        </nav>

        <div class="side-foot">
          <div class="sep"></div>
          <button class="mini" data-open="logs">日志目录</button>
          <button class="mini" data-open="root">安装目录</button>
          <button class="mini" id="btn-tray">最小化到托盘</button>
        </div>
      </aside>

      <!-- ============ 主区 ============ -->
      <div id="main">
        <div id="titlebar">
          <h2 id="page-title">总览</h2>
          <div class="win-btns">
            <button class="win-btn" id="btn-min" title="最小化">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button class="win-btn danger" id="btn-close" title="隐藏到托盘">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div id="pages">
          <!-- ---- 总览 ---- -->
          <section class="page on" data-page="home">
            <div class="bar">
              <button class="btn primary" id="btn-start">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
                启动后端
              </button>
              <button class="btn" id="btn-restart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg>
                重启
              </button>
              <button class="btn" id="btn-stop">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                停止
              </button>
            </div>

            <div class="grid3">
              <div class="card stat">
                <div class="k">服务状态</div>
                <div class="v"><span class="pill" id="p-svc"></span><span id="t-svc">检测中</span></div>
              </div>
              <div class="card stat">
                <div class="k">ASR 端口 6016</div>
                <div class="v"><span class="pill" id="p-port"></span><span id="t-port">检测中</span></div>
              </div>
              <div class="card stat">
                <div class="k">客户端</div>
                <div class="v"><span class="pill" id="p-cli"></span><span id="t-cli">检测中</span></div>
              </div>
            </div>

            <div class="card" style="margin-bottom: 14px">
              <div class="k">语音模型</div>
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 11px; flex-wrap: wrap">
                <div class="v" style="margin: 0; flex: 1; min-width: 140px" id="t-model">读取中</div>
                <select id="sel-model">
                  <option value="qwen_asr">Qwen3-ASR-1.7B</option>
                  <option value="qwen_asr_0_6b">Qwen3-ASR-0.6B</option>
                  <option value="fun_asr_nano">Fun-ASR-Nano</option>
                  <option value="sensevoice">SenseVoice</option>
                  <option value="paraformer">Paraformer</option>
                </select>
                <button class="btn" id="btn-model">应用并重启</button>
              </div>
            </div>

            <div class="card">
              <div class="k">最近识别</div>
              <div class="result empty selectable" id="t-result">尚无识别结果</div>
              <div class="tags" id="t-tags"></div>
              <div class="meta">
                <span>时延 <b id="m-lat">—</b></span>
                <span>时间 <b id="m-at">—</b></span>
              </div>
            </div>
          </section>

          <!-- ---- 客户端日志 ---- -->
          <section class="page" data-page="client">
            <div class="bar">
              <button class="btn" data-refresh="client">刷新</button>
              <button class="btn" data-open="logs">打开目录</button>
              <span class="logmeta" id="meta-client"></span>
              <label style="font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; margin-left: auto">
                <input type="checkbox" id="follow-client" checked /> 自动跟随
              </label>
            </div>
            <div class="log selectable" id="log-client">加载中…</div>
          </section>

          <!-- ---- 服务端日志 ---- -->
          <section class="page" data-page="server">
            <div class="bar">
              <button class="btn" data-refresh="server">刷新</button>
              <button class="btn" data-open="logs">打开目录</button>
              <span class="logmeta" id="meta-server"></span>
              <label style="font-size: 12px; color: var(--fg-2); display: flex; align-items: center; gap: 6px; margin-left: auto">
                <input type="checkbox" id="follow-server" checked /> 自动跟随
              </label>
            </div>
            <div class="log selectable" id="log-server">加载中…</div>
          </section>
        </div>

        <div id="foot">
          <span id="foot-msg">就绪</span>
          <span class="probe" id="foot-probe"></span>
        </div>
      </div>
    </div>

    <div id="dash-notes"></div>

    <script type="module" src="/src/dashboard.ts"></script>
  </body>
</html>
